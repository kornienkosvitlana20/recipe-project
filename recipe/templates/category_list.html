{% extends 'base.html' %}

{% block title %}Category List{% endblock %}

{% block content %}
  <h1>Category List</h1>
  <ul>
    {% for category in categories %}
      <li>{{ category.name }} ({{ category.recipe_count }} recipes)</li>
    {% empty %}
      <li>No categories found.</li>
    {% endfor %}
  </ul>
{% endblock %}
